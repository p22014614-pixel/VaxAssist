<!-- Doctor communications: read and send messages in the doctor's patient conversations. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communications - VaxAssist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="doctor_layout.css?v=5">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="stylesheet" href="doctor_theme.css?v=1">
    <link rel="stylesheet" href="doctor_effects.css?v=1">
    <script src="auth.js?v=9" defer></script>
    <script src="nav_bar.js?v=2" defer></script>
    <script src="doctor_nav.js?v=2" defer></script>
    <script src="motion.js?v=3" defer></script>
    <script src="doctor_communications.js?v=2" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="doctor-portal" data-require-role="doctor">

    <!-- Navigation -->
    <div data-doctor-nav></div>

    <header class="page-header doctor-page-heading">
        <div class="container text-center">
            <div class="section-label mb-3">Patient communications</div>
            <h1>Clear conversations, support better care.</h1>
        </div>
    </header>

    <main class="doctor-page-content">
        <div class="chat-layout">
            <!-- Sidebar: User Conversations -->
            <div class="chat-sidebar">
                <h3 style="color: var(--primary-dark); margin-bottom: 15px;">Conversations</h3>
                <label for="conversationSearch">Search patients</label>
                <input type="search" id="conversationSearch" class="form-control" placeholder="Search by patient name or ID" autocomplete="off">
                <div id="conversationPatientList" class="conversation-patient-list" role="listbox" aria-label="Patients">
                    <p class="text-muted">Loading patients…</p>
                </div>
            </div>

            <!-- Main Chat Panel -->
            <div class="chat-main">
                <h3 id="chatHeading" style="color: var(--primary-dark); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Choose a patient</h3>
                
                <div class="chat-messages" id="chatMessagesContainer">
                    <!-- Dynamic chat bubbles loaded via JavaScript -->
                </div>

                <div style="display: flex; gap: 10px;">
                    <input type="text" id="chatInputText" class="form-control" placeholder="Type your response to the patient..." autocomplete="off">
                    <button id="sendChatMessage" class="btn primary-btn" type="button">Send</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 VaxAssist. All Rights Reserved.</p>
    </footer>

    <script>
        let communicationPatients = [];
        let selectedPatientId = "";
        let sendingMessage = false;

        document.addEventListener("DOMContentLoaded", () => {
            const requestedPatient = new URLSearchParams(window.location.search).get("patient_id");
            document.getElementById("conversationSearch").addEventListener("input", renderPatientList);
            document.getElementById("conversationPatientList").addEventListener("click", event => {
                const patientButton = event.target.closest("[data-patient-id]");
                if (!patientButton) return;
                selectedPatientId = patientButton.dataset.patientId;
                renderPatientList();
                loadMessages(selectedPatientId);
            });
            document.getElementById("sendChatMessage").addEventListener("click", sendMessage);
            document.getElementById("chatInputText").addEventListener("keydown", event => {
                if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
                    event.preventDefault();
                    sendMessage();
                }
            });
            loadMessages(requestedPatient || "");
        });

        function renderPatientList() {
            const list = document.getElementById("conversationPatientList");
            const query = document.getElementById("conversationSearch").value.trim().toLocaleLowerCase();
            const matches = communicationPatients.filter(person =>
                person.full_name.toLocaleLowerCase().includes(query) || String(person.patient_id).includes(query)
            );
            list.replaceChildren();
            if (!matches.length) {
                const empty = document.createElement("p");
                empty.className = "text-muted";
                empty.textContent = communicationPatients.length ? "No patients match your search." : "No patients are registered.";
                list.append(empty);
                return;
            }
            matches.forEach(person => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "conversation-patient" + (String(person.patient_id) === selectedPatientId ? " is-active" : "");
                button.dataset.patientId = String(person.patient_id);
                button.setAttribute("role", "option");
                button.setAttribute("aria-selected", String(String(person.patient_id) === selectedPatientId));
                button.textContent = person.full_name;
                list.append(button);
            });
        }

        async function loadMessages(patientId = selectedPatientId) {
            const container = document.getElementById("chatMessagesContainer");
            try {
                const url = "doctor_communications_backend.php" + (patientId ? "?patient_id=" + encodeURIComponent(patientId) : "");
                const data = await VaxApi.get(url);
                if (data.status !== "success") throw new Error(data.message || "Could not load patients.");
                communicationPatients = data.patients || [];
                selectedPatientId = data.patient ? String(data.patient) : "";
                renderPatientList();
                const person = communicationPatients.find(item => String(item.patient_id) === selectedPatientId);
                document.getElementById("chatHeading").textContent = person ? "Chatting with: " + person.full_name : "Choose a patient";
                container.replaceChildren();
                if (!person) {
                    container.textContent = communicationPatients.length ? "Choose a patient to view or start a conversation." : "No patients are registered yet.";
                    return;
                }
                if (!data.data.length) {
                    container.textContent = "No message history found. You can start the conversation below.";
                    return;
                }
                data.data.forEach(msg => {
                    const bubble = document.createElement("div");
                    bubble.className = `msg-bubble ${msg.type}`;
                    bubble.textContent = msg.text;
                    container.appendChild(bubble);
                });
                container.scrollTop = container.scrollHeight;
            } catch (error) {
                console.error("Error loading messages:", error);
                container.textContent = error.message || "Could not load patients or messages.";
            }
        }

        async function sendMessage() {
            const input = document.getElementById("chatInputText");
            const text = input.value.trim();
            if (sendingMessage || !text) return;
            if (!selectedPatientId) {
                alert("Choose a patient before sending a message.");
                return;
            }
            sendingMessage = true;
            const button = document.getElementById("sendChatMessage");
            button.disabled = true;
            try {
                const data = await VaxApi.post("doctor_communications_backend.php", { message_text: text, patient_id: selectedPatientId });
                if (data.status !== "success") throw new Error(data.message || "Could not send the message.");
                input.value = "";
                await loadMessages(selectedPatientId);
                input.focus();
            } catch (error) {
                alert(error.message || "Could not send the message.");
            } finally {
                sendingMessage = false;
                button.disabled = false;
            }
        }
    </script>

</body>
</html>
