<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCare Clinic | Patient Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Corrected Link to Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Updated class to match styles.css centering rule -->
    <main class="auth-main">
        <div class="container">
            <div class="login-wrap">
                <div class="text-center mb-4">
                    <div class="login-icon">💉</div>
                    <h1 class="mb-2">Welcome back</h1>
                    <p class="text-secondary mb-0">Log in to view your vaccination schedule.</p>
                </div>

                <div class="login-card">
                    <div id="errorBox" class="alert alert-danger" style="display: none;" role="alert"></div>

                    <form action="login.php" method="POST" id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control" id="password" required>
                                <button type="button" class="toggle-pw" id="togglePw">Show</button>
                            </div>
                        </div>

                        <button type="submit" class="btn appointment-btn w-100 mt-2">Log in</button>
                    </form>
                </div>

                <p class="text-center text-secondary small mt-4 mb-0">
                    New here? <a href="register.html" class="text-link">Create an account</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="text-center p-4">
        <p class="mb-0">© 2026 <span>HealthCare Clinic</span> | All Rights Reserved</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            const errorBox = document.getElementById('errorBox');
            errorBox.innerText = error;
            errorBox.style.display = 'block';
        }

        const password = document.getElementById("password");
        document.getElementById("togglePw").addEventListener("click", function () {
            const hidden = password.type === "password";
            password.type = hidden ? "text" : "password";
            this.textContent = hidden ? "Hide" : "Show";
        });
    </script>
</body>
</html>
