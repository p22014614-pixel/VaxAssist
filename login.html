<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8fbfc">
    <title>VaxAssist | Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css?v=4">
    <script src="login.js?v=5" defer></script>
</head>
<body class="login-page">
    <main class="login-main">
        <div class="container">
            <div class="login-wrap">
                <div class="text-center mb-4 login-heading">
                    <div class="login-icon" aria-hidden="true">💉</div>
                    <h1 class="mb-2">Welcome back</h1>
                    <p class="subtext mb-0">Log in to view your vaccination schedule.</p>
                </div>
                <div class="login-card">
                    <div id="loginStatus" class="alert alert-danger py-2 small" role="alert" aria-live="polite" hidden></div>
                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" autocomplete="username" required>
                            <div class="field-error" id="emailError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group password-group">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                                <button type="button" class="toggle-pw" id="togglePassword" aria-label="Show password" aria-pressed="false">Show</button>
                            </div>
                            <div class="field-error" id="passwordError"></div>
                        </div>
                        <div class="d-flex justify-content-end align-items-center mb-4 small">
                            <a href="forgot-password.html" class="text-link">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn appointment-btn login-btn" id="submitButton"><span class="button-label">Log in</span></button>
                    </form>
                </div>
                <p class="text-center text-secondary small mt-4 mb-0">New here? <a href="register.html" class="text-link">Create an account</a></p>
            </div>
        </div>
    </main>
    <footer class="text-center p-4"><p class="mb-0">&copy; 2026 <span>VaxAssist</span> | All Rights Reserved</p></footer>
</body>
</html>
