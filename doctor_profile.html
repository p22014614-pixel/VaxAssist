<!-- Doctor profile: manage profile details, profile photo, and leave requests. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile - VaxAssist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="doctor_layout.css?v=13">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="styles.css?v=4">
    <link rel="stylesheet" href="doctor_theme.css?v=1">
    <link rel="stylesheet" href="doctor_effects.css?v=1">
    <script src="auth.js?v=9" defer></script>
    <script src="nav_bar.js?v=2" defer></script>
    <script src="doctor_nav.js?v=2" defer></script>
    <script src="motion.js?v=3" defer></script>
    <script src="doctor_profile.js?v=7" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="doctor-portal" data-require-role="doctor">

    <!-- Navigation -->
    <div data-doctor-nav></div>

    <header class="page-header doctor-page-heading">
        <div class="container text-center">
            <div class="section-label mb-3">Your professional profile</div>
            <h1>Make your profile your own.</h1>
        </div>
    </header>

    <main class="doctor-page-content doctor-profile-content">
        <div class="form-card">
            <div class="profile-section-heading">
                <h3>Personal Credentials</h3>
                <button type="button" class="btn primary-btn" data-bs-toggle="modal" data-bs-target="#leaveRequestModal"><i class="bi bi-calendar2-plus" aria-hidden="true"></i> Request leave</button>
            </div>
            <p id="profileLoadStatus" class="doctor-alert" role="status" aria-live="polite" hidden></p>
            <div class="profile-photo-wrap">
                <div class="profile-photo" aria-label="Doctor profile photo">
                    <span id="profileInitials">DR</span>
                    <img id="profilePhoto" alt="Doctor profile" hidden>
                </div>
                <div class="profile-photo-actions">
                    <label for="profilePhotoFile" class="form-label mb-0">Profile picture</label>
                    <input type="file" id="profilePhotoFile" accept="image/jpeg,image/png,image/webp">
                    <div class="profile-photo-icon-actions d-flex gap-2">
                        <button type="button" class="btn secondary-btn doctor-icon-button" id="uploadProfilePhoto" aria-label="Upload profile photo" title="Upload profile photo"><i class="bi bi-cloud-arrow-up" aria-hidden="true"></i></button>
                        <button type="button" class="btn secondary-btn doctor-icon-button" id="deleteProfilePhoto" aria-label="Delete profile photo" title="Delete profile photo" disabled><i class="bi bi-trash3" aria-hidden="true"></i></button>
                    </div>
                    <p>JPEG, PNG, or WebP, up to 2 MB.</p>
                    <span class="profile-photo-status" id="profilePhotoStatus" role="status" aria-live="polite"></span>
                </div>
            </div>
            <form id="doctorProfileForm" class="doctor-profile-fields">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control" value="Loading..." readonly>
                </div>
                <div class="form-group">
                    <label>Specialization</label>
                    <input type="text" id="specialization" class="form-control" value="Cardiology & Orthopedic Medicine" required maxlength="150">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" value="Loading..." readonly>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input type="date" id="dateOfBirth" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Assigned Consultation Room</label>
                    <input type="text" id="consultationRoom" class="form-control" value="Room 304" required maxlength="20">
                </div>
                <div class="form-group">
                    <label for="yearsExperience">Years of Experience</label>
                    <input type="number" id="yearsExperience" class="form-control" min="0" max="255" step="1" placeholder="Not provided">
                </div>
                <div class="form-group">
                    <label for="languages">Languages</label>
                    <input type="text" id="languages" class="form-control" maxlength="150" placeholder="For example: English, Malay">
                </div>
                <div class="form-group">
                    <label for="bio">Professional Biography</label>
                    <textarea id="bio" class="form-control" maxlength="5000" rows="4" placeholder="Describe your clinical experience and approach."></textarea>
                </div>
                <div class="form-group">
                    <label for="keywords">Patient Search Keywords</label>
                    <textarea id="keywords" class="form-control" maxlength="5000" rows="3" placeholder="Comma-separated topics patients can search for."></textarea>
                </div>
                <div class="doctor-profile-actions">
                    <button type="button" class="btn primary-btn" id="updateDoctorProfile">Update Profile</button>
                    <button type="button" class="btn profile-logout-btn doctor-icon-button" data-logout aria-label="Log out" title="Log out"><i class="bi bi-box-arrow-right" aria-hidden="true"></i></button>
                </div>
            </form>
        </div>

    </main>

    <div class="modal fade patient-history-modal" id="leaveRequestModal" tabindex="-1" aria-labelledby="leaveRequestHeading" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title fs-5" id="leaveRequestHeading">Request leave / time off</h2>
                        <p class="text-muted mb-0">Choose your dates and add a reason for the administrator.</p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close leave request"></button>
                </div>
                <div class="modal-body">
                    <form id="leaveForm">
                        <div class="form-group">
                            <label for="leaveStartDate">Start date</label>
                            <input type="date" id="leaveStartDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="leaveEndDate">End date</label>
                            <input type="date" id="leaveEndDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="leaveReason">Reason for leave</label>
                            <textarea id="leaveReason" class="form-control" maxlength="1000" placeholder="Annual leave, medical conference..." required></textarea>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn primary-btn" id="submitDoctorLeave">Submit leave request</button>
                            <button type="button" class="btn secondary-btn" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 VaxAssist. All Rights Reserved.</p>
    </footer>

</body>
</html>
