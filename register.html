<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCare Clinic | Create Account</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Corrected Link to Main Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Updated class to match styles.css centering rule -->
    <main class="auth-main">
        <div class="container">
            <div class="register-wrap">
                <div class="text-center mb-4">
                    <div class="register-icon">💉</div>
                    <h1 class="mb-2">Create your account</h1>
                    <p class="text-secondary mb-0">Get a personalised vaccination schedule for you and your family.</p>
                </div>

                <div class="register-card">
                    <div id="messageBox" class="alert alert-success" style="display: none;" role="alert"></div>
                    <div id="errorBox" class="alert alert-danger" style="display: none;" role="alert"></div>

                    <form action="register.php" method="POST" id="registerForm">
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="firstName" class="form-label">First name</label>
                                <input type="text" name="firstName" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="lastName" class="form-label">Last name</label>
                                <input type="text" name="lastName" class="form-control" id="lastName" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control" id="email" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="phone" class="form-label">Phone number</label>
                                <input type="tel" name="phone" class="form-control" id="phone" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="dob" class="form-label">Date of birth</label>
                                <input type="date" name="dob" class="form-control" id="dob" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control" id="password" minlength="8" required>
                                <button type="button" class="toggle-pw" id="togglePw">Show</button>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label small text-secondary" for="terms">
                                I agree to the <a href="#" class="text-link">Terms of Service</a>.
                            </label>
                        </div>

                        <button type="submit" class="btn appointment-btn w-100">Create account</button>
                    </form>
                </div>

                <p class="text-center text-secondary small mt-4 mb-0">
                    Already have an account? <a href="login.html" class="text-link">Log in</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="text-center p-4">
        <p class="mb-0">© 2026 <span>HealthCare Clinic</span> | All Rights Reserved</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const message = urlParams.get('message');
        const error = urlParams.get('error');

        if (message) {
            const msgBox = document.getElementById('messageBox');
            msgBox.innerText = message;
            msgBox.style.display = 'block';
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        }

        if (error) {
            const errBox = document.getElementById('errorBox');
            errBox.innerText = error;
            errBox.style.display = 'block';
        }

        const password = document.getElementById("password");
        document.getElementById("togglePw").addEventListener("click", function () {
            const hidden = password.type === "password";
            password.type = hidden ? "text" : "password";
            this.textContent = hidden ? "Hide" : "Show";
        });
    </script>
</body>
</html>
