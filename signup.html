<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f8fb">
    <title>Create an account | VaxAssist</title>
    <style>
        :root {
            --primary: #1976d2;
            --primary-dark: #155a96;
            --page-bg: #f4f8fb;
            --panel-bg: #eaf5ff;
            --text: #333;
            --muted: #666;
            --white: #fff;
            --shadow: 0 5px 20px rgba(0, 0, 0, .1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--page-bg);
            color: var(--text);
        }

        .site-header {
            height: 70px;
            flex: 0 0 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            background: var(--white);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .logo {
            color: var(--primary);
            font-size: 26px;
            font-weight: 700;
            text-decoration: none;
        }

        .home-link {
            color: var(--primary-dark);
            font-size: 15px;
            text-decoration: none;
        }

        .home-link:hover,
        .home-link:focus-visible {
            color: var(--primary);
            text-decoration: underline;
        }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 40px 20px;
            background: var(--panel-bg);
        }

        .signup-card {
            width: min(100%, 460px);
            padding: 40px;
            border-radius: 12px;
            background: var(--white);
            box-shadow: var(--shadow);
        }

        .eyebrow {
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 10px;
            color: var(--primary-dark);
            font-size: 34px;
        }

        .intro {
            margin-bottom: 26px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 700;
        }

        .field {
            width: 100%;
            min-height: 52px;
            padding: 13px 15px;
            border: 1px solid #cbd9e5;
            border-radius: 6px;
            background: var(--white);
            color: var(--text);
            font-size: 16px;
        }

        .field:focus {
            border-color: var(--primary);
            outline: 3px solid rgba(25, 118, 210, .15);
        }

        .submit-button {
            width: 100%;
            min-height: 54px;
            margin-top: 5px;
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: var(--white);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover {
            background: var(--primary-dark);
        }

        .signin-prompt {
            margin-top: 20px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .text-link {
            color: var(--primary);
            text-decoration: none;
        }

        .text-link:hover,
        .text-link:focus-visible {
            text-decoration: underline;
        }

        footer {
            padding: 16px 20px;
            background: var(--primary-dark);
            color: var(--white);
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 520px) {
            .site-header {
                height: 64px;
                flex-basis: 64px;
                padding: 0 5%;
            }

            .logo {
                font-size: 23px;
            }

            main {
                padding: 28px 16px;
            }

            .signup-card {
                padding: 30px 24px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="index.html">VaxAssist</a>
        <a class="home-link" href="index.html">&#8592; Back to home</a>
    </header>

    <main>
        <section class="signup-card" aria-labelledby="signup-title">
            <p class="eyebrow">Join VaxAssist</p>
            <h1 id="signup-title">Create your account</h1>
            <p class="intro">
                Create an account to book and manage your healthcare appointments.
            </p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input
                        class="field"
                        id="full-name"
                        name="fullName"
                        type="text"
                        autocomplete="name"
                        placeholder="Your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        class="field"
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Create password</label>
                    <input
                        class="field"
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required
                    >
                </div>

                <button class="submit-button" type="submit">Create account</button>
            </form>

            <p class="signin-prompt">
                Already have an account?
                <a class="text-link" href="login.html">Sign in</a>
            </p>
        </section>
    </main>

    <footer>&copy; 2026 VaxAssist. All Rights Reserved.</footer>
</body>
</html>
